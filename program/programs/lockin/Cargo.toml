[package]
name = "lockin"
version = "0.1.0"
description = "Lock-In: a deposit locked on a personal goal"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "lockin"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "token_2022", "solana-v4"] }

[dev-dependencies]
litesvm = "0.18.0"
litesvm-token = { version = "0.18.0", features = ["token-2022"] }
solana-address = "2.7"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-message = "4.2"
solana-signer = "3.0"
solana-transaction = "4.1"
solana-clock = "3.2"
spl-token-interface = "3"
solana-transaction-error = "3.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
